name: tm-test

services:
  # Stands in for the install domain: serves dist/ (install.sh, channels/*.json, files/*.tar.gz).
  install-host:
    image: nginx:1.29-alpine
    volumes:
      - ../dist:/usr/share/nginx/html:ro
    networks: [hotel]

  # Fake Cloudflare API (DNS, zone settings, purges, Origin CA) — see fake-cloudflare/.
  fake-cloudflare:
    build:
      context: ..
      dockerfile: test-env/fake-cloudflare/Dockerfile
    networks: [hotel]

  # Fake GitHub: SSH git server with per-repository deploy keys + a test admin API (fake-github/).
  fake-github:
    build: ./fake-github
    networks: [hotel]

  # S3-compatible storage for backup targets (SeaweedFS's S3 gateway; MinIO no longer publishes images).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=5", "-master.volumeSizeLimitMB=64"]
    volumes:
      - ./backup-targets/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [hotel]

  # An SFTP server for backup targets, like a storage box (backup-targets/sftp/).
  backup-sftp:
    build: ./backup-targets/sftp
    networks: [hotel]

  # The fresh Ubuntu server under test.
  server:
    build:
      context: ./server
      args:
        UBUNTU: ${UBUNTU:-24.04}
    image: tm-test-server:${UBUNTU:-24.04}
    hostname: hotel-test
    privileged: true
    cgroup: private
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "8443:8443"
      - "8080:80"
    networks:
      hotel:
        aliases: [server]
    depends_on: [install-host, fake-cloudflare, fake-github, s3, backup-sftp]

  # Runs the e2e scripts against the server over the network.
  tester:
    build:
      context: .
      dockerfile: tester/Dockerfile
    profiles: [test]
    networks: [hotel]
    depends_on: [server]

networks:
  hotel: {}
