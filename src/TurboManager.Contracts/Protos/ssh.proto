syntax = "proto3";

option csharp_namespace = "TurboManager.Contracts.Agent";

package turbomanager.agent.v1;

import "google/protobuf/empty.proto";

// SSH access: authorized_keys of login users and the sshd settings the panel manages.
service SshAgent {
  rpc ListLoginUsers (google.protobuf.Empty) returns (LoginUsers);
  rpc ListAuthorizedKeys (SshUserRef) returns (AuthorizedKeys);
  rpc AddAuthorizedKey (AddAuthorizedKeyRequest) returns (AuthorizedKeys);
  rpc RemoveAuthorizedKey (RemoveAuthorizedKeyRequest) returns (AuthorizedKeys);
  rpc GetSshdSettings (google.protobuf.Empty) returns (SshdSettings);
  rpc UpdateSshdSettings (SshdSettingsUpdate) returns (SshdSettings);
}

message LoginUsers {
  repeated LoginUser users = 1;
}

message LoginUser {
  string name = 1;
  int32 uid = 2;
  string home = 3;
  bool sudo = 4;
  int32 key_count = 5;
}

message SshUserRef {
  string user = 1;
}

message AuthorizedKeys {
  string user = 1;
  repeated AuthorizedKey keys = 2;
}

message AuthorizedKey {
  string type = 1;
  string fingerprint = 2;  // SHA256:...
  string comment = 3;
  string options = 4;      // e.g. from="1.2.3.4",no-pty
}

message AddAuthorizedKeyRequest {
  string user = 1;
  string public_key = 2;   // one authorized_keys line
}

message RemoveAuthorizedKeyRequest {
  string user = 1;
  string fingerprint = 2;
}

message SshdSettings {
  bool password_authentication = 1;
  string permit_root_login = 2;    // yes | no | prohibit-password | forced-commands-only
  bool pubkey_authentication = 3;
  repeated int32 ports = 4;
}

message SshdSettingsUpdate {
  optional bool password_authentication = 1;
  string permit_root_login = 2;    // "" = unchanged
}
