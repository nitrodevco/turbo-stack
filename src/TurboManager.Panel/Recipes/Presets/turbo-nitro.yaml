id: turbo-nitro
name: Turbo + Nitro hotel
summary: The emulator, its admin panel and website, the Nitro client and imager, and a host for the game assets.
description: >-
  Every part gets its own subdomain of the hotel's domain and is wired to the others: the client knows the
  socket and asset addresses, the emulator knows where its admin panel, website, client and imager are,
  and the website's security headers allow the client and imager. Change a domain later and the panel
  shows what needs to be rebuilt, restarted or reloaded, then does it.

settings:
  - key: hotelName
    label: Hotel name
    default: Turbo
  - key: ownerName
    label: Owner's username
    required: true
    help: Your player name. When you sign up on the website with it, the emulator logs your admin panel setup link.

# Optional parts can be left out (their addresses are then given as settings) and added or removed later.
# The emulator and the website stay: the admin panel and the website reach the emulator on local ports.
# Created in this order (the emulator first: other apps use its ports) and deployed in deployOrder.
roles:
  - role: emulator
    recipe: turbo-emulator
    host: ws
    label: Emulator (WebSocket)
  - role: web
    recipe: turbo-web
    host: "@"
    label: Website
  - role: client
    recipe: nitro-client
    host: play
    label: Game client
    optional: true # or a client hosted elsewhere (settings: client.url)
  - role: admin
    recipe: turbo-admin
    host: admin
    label: Admin panel
    optional: true # some hotels run without it (settings: admin.url)
  - role: imager
    recipe: nitro-imager
    host: imager
    label: Imager
    optional: true # or a shared imager (settings: imager.url, imager.avatarUrl)
  - role: assets
    recipe: static-assets
    host: assets
    label: Game assets
    optional: true # or an existing asset host (settings: assets.url, assets.badgeUrl)

deployOrder: [emulator, admin, web, client, imager]
