name: Release

# Tag v1.2.3 for a stable release (also offered on the beta channel), v1.2.3-beta.1 for a beta.
# The tag message becomes the release notes the panel shows before updating.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-24.04
    steps:
      # Checked first: a release that can't reach the install domain would be published on GitHub but never offered.
      - name: Secrets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in RELEASE_SIGNING_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [[ -n "${!name}" ]] || { echo "The $name secret is not set." >&2; missing=1; }
          done
          exit $missing

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - name: Tests
        run: dotnet test --configuration Release

      - name: Package and sign
        env:
          # PEM of the ECDSA P-256 release key (scripts/release-key.sh). Every server trusts only this key's
          # signatures, so it is required here: a release is never signed with a throwaway key.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "The RELEASE_SIGNING_KEY secret is not set." >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          channels=(--channel beta)
          [[ "$version" == *-* ]] || channels+=(--channel stable)
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          VERSION="$version" scripts/package.sh --arch x64 --arch arm64 "${channels[@]}" --notes "$RUNNER_TEMP/notes.md" --docs \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          tar -czf "$RUNNER_TEMP/docs.tar.gz" -C dist docs
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/files/* dist/channels/* dist/install.sh "$RUNNER_TEMP/docs.tar.gz"

      # install.nitrodev.co is a Cloudflare Pages project (install/site/README.md). Every deploy replaces the whole site,
      # so a beta keeps install.sh, the docs and the stable channel from the latest stable release and only moves beta.
      - name: Assemble the install domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/channels"
          stable=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            stable="$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          fi
          if [[ -n "$stable" ]]; then
            gh release download "$stable" --dir "$RUNNER_TEMP/stable" --pattern install.sh --pattern 'stable.json*' --pattern docs.tar.gz
            cp "$RUNNER_TEMP/stable/install.sh" "$site/"
            cp "$RUNNER_TEMP/stable/"stable.json* "$site/channels/"
            tar -xzf "$RUNNER_TEMP/stable/docs.tar.gz" -C "$site"
          else
            cp dist/install.sh "$site/"
            cp -r dist/docs "$site/"
          fi
          cp dist/channels/* "$site/channels/"
          cp install/site/_headers install/site/_redirects "$site/"
          find "$site" -maxdepth 2 -not -path "$site/docs/*" | sort

      - name: Deploy the install domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name=turbo-stack-install --branch=main --commit-dirty=true
